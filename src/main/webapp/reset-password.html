<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Reset Password - Vehicle Service Portal</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    font-family: Arial, Helvetica, sans-serif;

    background: linear-gradient(
        135deg,
        #eef4ff,
        #dbeafe
    );

    color: #1e293b;
}

.container {
    width: 100%;
    max-width: 450px;
}

.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo-icon {
    font-size: 52px;
}

.logo h1 {
    margin: 8px 0 0;

    color: #1e3a8a;

    font-size: 28px;
}

.card {
    background: white;

    padding: 35px;

    border-radius: 18px;

    box-shadow:
        0 12px 35px
        rgba(30, 58, 138, 0.15);
}

.card h2 {
    margin-top: 0;

    text-align: center;

    color: #1e3a8a;
}

.description {
    text-align: center;

    color: #64748b;

    line-height: 1.6;

    margin-bottom: 25px;
}

label {
    display: block;

    margin-top: 16px;
    margin-bottom: 8px;

    font-weight: bold;

    color: #334155;
}

input {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid #cbd5e1;

    border-radius: 9px;

    background: #f8fafc;

    font-size: 16px;

    outline: none;
}

input:focus {
    border-color: #2563eb;

    background: white;

    box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.12);
}

button {
    width: 100%;

    margin-top: 25px;

    padding: 14px;

    border: none;

    border-radius: 9px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #1d4ed8;

    transform: translateY(-1px);
}

.back {
    display: block;

    margin-top: 20px;

    text-align: center;

    color: #64748b;

    text-decoration: none;

    font-size: 14px;
}

.back:hover {
    color: #2563eb;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<div class="logo-icon">🔐</div>

<h1>Vehicle Service Portal</h1>

</div>

<div class="card">

<h2>Create New Password</h2>

<p class="description">
Enter your new password below.
</p>

<form action="reset-password" method="post">

<input
    type="hidden"
    id="token"
    name="token"
>

<label for="password">
New Password
</label>

<input
    type="password"
    id="password"
    name="password"
    placeholder="Enter new password"
    minlength="6"
    required
>

<label for="confirmPassword">
Confirm Password
</label>

<input
    type="password"
    id="confirmPassword"
    name="confirmPassword"
    placeholder="Confirm new password"
    minlength="6"
    required
>

<button type="submit">
Reset Password
</button>

</form>

<a href="login.html" class="back">
← Back to Login
</a>

</div>

</div>

<script>

const params =
    new URLSearchParams(window.location.search);

const token =
    params.get("token");

document.getElementById("token").value =
    token || "";

</script>

</body>

</html>
