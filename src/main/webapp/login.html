<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Vehicle Service Portal</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #eef4ff,
                #dbeafe
            );

            color: #1e293b;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            font-size: 55px;
        }

        .logo h1 {
            margin: 8px 0 0;

            color: #1e3a8a;

            font-size: 30px;
        }

        .logo p {
            margin-top: 8px;

            color: #64748b;
        }

        .login-card {
            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 12px 35px
                rgba(30, 58, 138, 0.15);
        }

        .login-card h2 {
            margin-top: 0;

            text-align: center;

            color: #1e3a8a;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 16px;
            margin-bottom: 7px;

            font-weight: bold;

            color: #334155;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            background: #f8fafc;

            font-size: 16px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;

            transform: translateY(-1px);
        }

        .register {
            text-align: center;

            margin-top: 25px;

            color: #64748b;
        }

        .register a {
            color: #2563eb;

            font-weight: bold;

            text-decoration: none;
        }

        .register a:hover {
            color: #1e3a8a;

            text-decoration: underline;
        }

        .admin-link {
            text-align: center;

            margin-top: 18px;
        }

        .admin-link a {
            color: #64748b;

            font-size: 14px;

            text-decoration: none;
        }

        .admin-link a:hover {
            color: #2563eb;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 25px 20px;
            }

            .logo h1 {
                font-size: 26px;
            }
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">

        <div class="logo-icon">🚗</div>

        <h1>Vehicle Service Portal</h1>

        <p>Manage your vehicle services with ease</p>

    </div>

    <div class="login-card">

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to your account
        </p>

        <form action="login" method="post">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

<input
    type="password"
    id="password"
    name="password"
    placeholder="Enter your password"
    required
>

<div style="text-align: right; margin-top: 8px;">

    <a href="forgot-password.html"
       style="color: #2563eb;
              font-size: 14px;
              text-decoration: none;">
        Forgot Password?
    </a>

</div>

<button type="submit">
    Login
</button>
        </form>

        <div class="register">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>

        <div class="admin-link">

            <a href="admin-login.html">
                Administrator Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
