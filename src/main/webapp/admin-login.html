<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Vehicle Service Portal</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <div class="form-box">

        <h1>Vehicle Service Portal</h1>

        <h2>Admin Login</h2>

        <form action="admin-login" method="post">

            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Enter admin email"
                   required>

            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Enter admin password"
                   required>

            <button type="submit">
                Admin Login
            </button>

        </form>

        <p>
            <a href="login.html">User Login</a>
        </p>

    </div>

</div>

</body>

</html>
