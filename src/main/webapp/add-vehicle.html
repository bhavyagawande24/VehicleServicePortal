<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Vehicle - AUTOLUX</title>

    <link rel="stylesheet" href="css/autolux-booking.css">

<style>/* AUTOLUX Add Vehicle Theme */
body {
    background: #080a08 !important;
    color: #f5f5f5 !important;
}
.container {
    max-width: 900px !important;
    margin: 55px auto !important;
}
.form-box {
    background: #111411 !important;
    color: #f5f5f5 !important;
    border: 1px solid #30372a;
    border-radius: 20px !important;
    padding: 40px !important;
    box-shadow: 0 12px 35px rgba(0,0,0,.35);
}
h1 {
    color: #c6ff00 !important;
    text-align: center;
    font-size: 42px;
    margin-bottom: 25px;
}
h2 {
    color: #f5f5f5 !important;
    margin-bottom: 28px;
}
label {
    display: block;
    color: #dedede !important;
    margin: 18px 0 9px;
    font-weight: 600;
}
input, select {
    width: 100%;
    box-sizing: border-box;
    background: #1a1e18 !important;
    color: #fff !important;
    border: 1px solid #424a3a !important;
    border-radius: 10px !important;
    padding: 14px !important;
    font-size: 16px;
}
input::placeholder {
    color: #999 !important;
}
input:focus, select:focus {
    outline: none;
    border-color: #c6ff00 !important;
    box-shadow: 0 0 0 2px rgba(198,255,0,.13);
}
button {
    width: 100%;
    margin-top: 28px;
    padding: 15px !important;
    background: #c6ff00 !important;
    color: #080a08 !important;
    border: none !important;
    border-radius: 10px !important;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
}
button:hover {
    background: #dcff70 !important;
}
.form-box p {
    margin-top: 24px;
}
.form-box a {
    color: #c6ff00 !important;
    text-decoration: none;
    font-weight: 700;
}
.form-box a:hover {
    text-decoration: underline;
}
@media (max-width: 600px) {
    .container { width: 92%; margin: 25px auto !important; }
    .form-box { padding: 24px !important; }
}
</style>

</head>

<body>

<div class="container">

    <div class="form-box">

        <h1>AUTOLUX</h1>

        <h2>Add Your Vehicle</h2>

        <form action="add-vehicle" method="post">

            <label>Vehicle Number</label>

            <input type="text"
                   name="vehicleNumber"
                   placeholder="e.g. MH12AB1234"
                   required>

            <label>Vehicle Type</label>

            <select name="vehicleType" required>

                <option value="">Select Vehicle Type</option>

                <option value="Car">Car</option>

                <option value="Bike">Bike</option>

                <option value="Scooter">Scooter</option>

                <option value="Other">Other</option>

            </select>

            <label>Vehicle Model</label>

            <input type="text"
                   name="model"
                   placeholder="e.g. Honda City"
                   required>

            <button type="submit">
                Add Vehicle
            </button>

        </form>

        <p>
            <a href="dashboard.html">Back to Dashboard</a>
        </p>

    </div>

</div>

</body>

</html>
